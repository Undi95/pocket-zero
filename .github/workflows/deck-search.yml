name: Deck search (Pocket Deck Lab)

on:
  workflow_dispatch:
    inputs:
      lock:
        description: 'Cartes imposées, ex "B1a 042,B1a 062" (vide = recherche libre)'
        required: false
        default: ''
      gens:
        description: 'Générations de l''algorithme génétique'
        required: false
        default: '25'
      round:
        description: 'Numéro de relance (automatique, laisser 1)'
        required: false
        default: '1'

permissions:
  contents: write
  actions: write

concurrency:
  group: deck-search
  cancel-in-progress: false

jobs:
  search:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --release --bin deckgym
      - name: Search
        env:
          THREADS: '4'
        run: |
          # stop ~25 min before the job limit so results can always be committed; the pipeline resumes on next run
          code=0; timeout 19500 python3 -I lab/search/pipeline.py --gens "${{ inputs.gens }}" --lock "${{ inputs.lock }}" || code=$?
          echo "$code" > "$RUNNER_TEMP/search_exit"
      - name: Commit results
        if: always()
        run: |
          git config user.name "pocket-deck-lab-bot"
          git config user.email "actions@users.noreply.github.com"
          git add lab/results
          git commit -m "Deck search results ($(date -u +%Y-%m-%dT%H:%MZ))" || exit 0
          git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}"
      - name: Continue in a new job if the search is not finished
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # the search is resumable: relaunch until the final report exists (max 4 jobs ~ 22 h)
          if [ -n "${{ inputs.lock }}" ]; then done_file=lab/results/stage_D_lock.json; else done_file=lab/results/stage_D.json; fi
          round="${{ inputs.round }}"
          # only when the job ran out of time (exit 124), never after a crash
          if [ "$(cat "$RUNNER_TEMP/search_exit" 2>/dev/null)" = "124" ] && [ ! -f "$done_file" ] && [ "${round:-1}" -lt 4 ]; then
            gh workflow run deck-search.yml --ref "${GITHUB_REF_NAME}" \
              -f lock="${{ inputs.lock }}" -f gens="${{ inputs.gens }}" -f round="$(( ${round:-1} + 1 ))"
          fi
